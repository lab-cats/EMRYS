name: Phase 1 CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  merge_group:
  workflow_dispatch:
    inputs:
      python311:
        description: Run the complete Python 3.11 suite
        required: true
        default: false
        type: boolean
      synthetic_130:
        description: Run the real-tool 130-pair synthetic E2E
        required: true
        default: false
        type: boolean
      synthetic_100000:
        description: Run the real-tool 100,000-pair synthetic E2E
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 5 * * 1-6"
    - cron: "17 5 * * 0"

permissions:
  contents: read

concurrency:
  group: phase-1-ci-${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_LINUX_AMD64_SHA256: >-
    8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  MINIMUM_PYTHON_VERSION: "3.11"
  PIXI_VERSION: "v0.75.0"
  PRIMARY_PYTHON_VERSION: "3.14"
  PYTHON_TEST_SHARD_COUNT: "4"
  UV_VERSION: "0.12.3"
  R_VERSION: "4.6.1"

jobs:
  manual-selection:
    name: Validate manually selected long lanes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require at least one selected long lane
        shell: bash
        env:
          RUN_PYTHON311: ${{ inputs.python311 }}
          RUN_SYNTHETIC_130: ${{ inputs.synthetic_130 }}
          RUN_SYNTHETIC_100000: ${{ inputs.synthetic_100000 }}
        run: |
          set -euo pipefail
          if [[ "${RUN_PYTHON311}" != true &&
                "${RUN_SYNTHETIC_130}" != true &&
                "${RUN_SYNTHETIC_100000}" != true ]]; then
            printf '%s\n' \
              'ERROR: select at least one lane: Python 3.11, 130-pair E2E, or 100,000-pair E2E.' >&2
            exit 2
          fi

  workflow-lint:
    name: Workflow lint
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive_name="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive_name}"
          curl --fail --location --silent --show-error \
            --output "${archive_path}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive_name}"
          printf '%s  %s\n' \
            "${ACTIONLINT_LINUX_AMD64_SHA256}" "${archive_path}" \
            | sha256sum --check
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -version

      - name: Lint GitHub Actions workflows
        shell: bash
        run: >-
          "${RUNNER_TEMP}/actionlint"
          -shellcheck=
          -pyflakes=
          -color

  static-wheel:
    name: Static, lint, docs, and wheel
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up primary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Run static, lint, documentation, and wheel checks
        shell: bash
        run: |
          set -euo pipefail
          make -s validation-static
          .venv/bin/python -m pytest -q tests/test_python_test_shards.py
          make -s validation-wheel-smoke

  shell-contracts:
    name: Shell owner contracts
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up primary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Run direct shell-owner contracts
        shell: bash
        run: make -s validation-shell-contracts

  guarded-r:
    name: Guarded R fixtures
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select isolated R cache and library paths
        shell: bash
        run: |
          printf 'RENV_PATHS_CACHE=%s/emrys-renv/cache\n' \
            "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'RENV_PATHS_LIBRARY=%s/emrys-renv/library\n' \
            "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Set up primary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up exact R version
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: false

      - name: Install locked R system requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libbz2-dev \
            libcurl4-openssl-dev \
            liblzma-dev \
            libpng-dev \
            libssl-dev \
            libxml2-dev \
            xz-utils \
            zlib1g-dev

      - name: Restore exact R dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/emrys-renv/cache
            ${{ runner.temp }}/emrys-renv/library
          key: >-
            emrys-renv-${{ runner.os }}-${{ runner.arch }}-R-${{ env.R_VERSION }}-${{ hashFiles('renv.lock') }}

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Restore and select locked R environment
        shell: bash
        run: |
          set -euo pipefail
          rscript_bin="$(command -v Rscript)"
          make -s r-restore RSCRIPT_BIN="${rscript_bin}"
          renv_library="$({
            EMRYS_USE_RENV=1 \
            EMRYS_LOCAL_PILOT_R=0 \
            RENV_CONFIG_SANDBOX_ENABLED=FALSE \
            RENV_CONFIG_AUTO_SNAPSHOT=FALSE \
            RENV_PROJECT="${GITHUB_WORKSPACE}" \
            R_PROFILE_USER="${GITHUB_WORKSPACE}/.Rprofile" \
              "${rscript_bin}" -e \
                'cat(normalizePath(.libPaths()[[1L]], winslash = "/", mustWork = TRUE))'
          })"
          test -n "${renv_library}"
          test -d "${renv_library}"
          printf 'RENV_LIBRARY=%s\n' "${renv_library}" >> "${GITHUB_ENV}"

      - name: Run guarded R environment and fixture checks
        shell: bash
        run: make -s validation-guarded-r RSCRIPT_BIN="$(command -v Rscript)"

  managed-runtime-userspace:
    name: Managed runtime userspace (${{ matrix.label }})
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Rocky 8.10
            image: rockylinux/rockylinux:8.10
            os_id: rocky
            os_version: "8.10"
            glibc: "2.28"
          - label: Ubuntu 22.04
            image: ubuntu:22.04
            os_id: ubuntu
            os_version: "22.04"
            glibc: "2.35"
          - label: Debian 12
            image: debian:12
            os_id: debian
            os_version: "12"
            glibc: "2.36"
    steps:
      - name: Select managed-runtime paths
        shell: bash
        run: |
          printf 'PIXI_WORKSPACE=%s/emrys-managed-runtime\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'PIXI_MANIFEST=%s/emrys-managed-runtime/pixi.toml\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Stage the reviewed lock outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = "${{ matrix.os_id }}"
          test "${VERSION_ID}" = "${{ matrix.os_version }}"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc ${{ matrix.glibc }}"
          install -d -m 0700 "${PIXI_WORKSPACE}"
          cp -- \
            src/emrys/resources/runtime/pixi.toml \
            src/emrys/resources/runtime/pixi.lock \
            "${PIXI_WORKSPACE}/"
          printf 'Container userspace: %s %s; %s\n' \
            "${ID}" "${VERSION_ID}" "$(getconf GNU_LIBC_VERSION)"
          printf 'Observed shared runner kernel (not a 4.18-kernel proof): %s\n' \
            "$(uname -r)"

      - name: Install the distro TLS trust bundle
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          if [[ "${ID}" = rocky ]]; then
            dnf --assumeyes install ca-certificates
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends ca-certificates
          fi

      - name: Install both managed environments from the unchanged lock
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: ${{ env.PIXI_MANIFEST }}
          environments: native r
          activate-environment: r
          locked: true
          cache: false
          post-cleanup: true

      - name: Verify locked tools in this container userspace
        shell: bash
        run: |
          set -euo pipefail
          native_prefix="${PIXI_WORKSPACE}/.pixi/envs/native"
          r_prefix="${PIXI_WORKSPACE}/.pixi/envs/r"
          export PATH="${native_prefix}/bin:${PATH}"
          test "$(sha256sum src/emrys/resources/runtime/pixi.toml | awk '{print $1}')" = \
            "$(sha256sum "${PIXI_WORKSPACE}/pixi.toml" | awk '{print $1}')"
          test "$(sha256sum src/emrys/resources/runtime/pixi.lock | awk '{print $1}')" = \
            "$(sha256sum "${PIXI_WORKSPACE}/pixi.lock" | awk '{print $1}')"
          test -x "${native_prefix}/bin/STAR"
          test -x "${native_prefix}/bin/samtools"
          test -x "${native_prefix}/bin/gatk"
          test -x "${native_prefix}/bin/bcftools"
          test -x "${native_prefix}/bin/infer_experiment.py"
          test -x "${native_prefix}/bin/java"
          test -x "${native_prefix}/bin/gunzip"
          test -x "${r_prefix}/bin/Rscript"
          test -e "${r_prefix}/lib/libxml2.so"
          test -x "${r_prefix}/bin/xml2-config"
          "${r_prefix}/bin/pkg-config" --exists libxml-2.0
          PATH="${native_prefix}/bin" "${native_prefix}/bin/STAR" --version
          PATH="${native_prefix}/bin" "${r_prefix}/bin/Rscript" \
            --no-environ --no-site-file --no-restore --no-save \
            -e 'cat(R.version.string)'
          shopt -s nullglob
          picard_jars=("${native_prefix}"/share/picard-slim-3.1.1-*/picard.jar)
          test "${#picard_jars[@]}" -eq 1
          test -f "${picard_jars[0]}"
          test ! -L "${picard_jars[0]}"
          "${native_prefix}/bin/STAR" --version
          "${native_prefix}/bin/samtools" --version
          "${native_prefix}/bin/gatk" --version
          "${native_prefix}/bin/bcftools" --version
          "${native_prefix}/bin/infer_experiment.py" --version
          "${native_prefix}/bin/java" -version
          "${r_prefix}/bin/Rscript" --version
          pixi list --locked --manifest-path "${PIXI_MANIFEST}" \
            --environment native --json > /dev/null
          pixi list --locked --manifest-path "${PIXI_MANIFEST}" \
            --environment r --json > /dev/null

  managed-golden-path:
    name: Managed golden path (Python 3.14)
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up primary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Pixi without provisioning the scientific runtime
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false
          cache: false

      - name: Prepare a clean clone, environment, and synthetic Project
        id: golden
        shell: bash
        run: |
          set -euo pipefail
          clean_clone="${RUNNER_TEMP}/emrys-golden-clone"
          evidence_root="${RUNNER_TEMP}/emrys-managed-golden"
          install -d -m 0700 "${evidence_root}"
          git clone --no-hardlinks "${GITHUB_WORKSPACE}" "${clean_clone}"
          git -C "${clean_clone}" checkout --detach "${GITHUB_SHA}"
          uv sync \
            --project "${clean_clone}" \
            --locked \
            --group workflow \
            --python python
          project_root="${evidence_root}/project"
          emrys=("${clean_clone}/.venv/bin/emrys")
          cd "${clean_clone}"
          "${emrys[@]}" init synthetic \
            --output-dir "${project_root}" --execute \
            2>&1 | tee "${evidence_root}/01-init.log"
          printf 'clone=%s\n' "${clean_clone}" >> "${GITHUB_OUTPUT}"
          printf 'evidence=%s\n' "${evidence_root}" >> "${GITHUB_OUTPUT}"

      - name: Cache managed golden-path R packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/emrys-managed-golden/project/runtime/managed/renv/cache
          key: >-
            emrys-managed-golden-renv-v1-${{ runner.os }}-${{ runner.arch }}-R-${{ env.R_VERSION }}-${{ hashFiles('renv.lock', 'src/emrys/resources/runtime/pixi.lock') }}

      - name: Repair and exercise the supported managed golden path
        shell: bash
        run: |
          set -euo pipefail
          clean_clone="${{ steps.golden.outputs.clone }}"
          evidence_root="${{ steps.golden.outputs.evidence }}"
          project_root="${evidence_root}/project"
          emrys=("${clean_clone}/.venv/bin/emrys")
          cd "${project_root}"

          "${emrys[@]}" validate \
            2>&1 | tee "${evidence_root}/02-validate.log"
          "${emrys[@]}" doctor --repair --execute \
            2>&1 | tee "${evidence_root}/03-doctor.log"
          "${emrys[@]}" run --execute \
            2>&1 | tee "${evidence_root}/04-run.log"

          mapfile -d '' -t run_roots < <(
            find "${project_root}/runs" -mindepth 1 -maxdepth 1 \
              -type d -name 'run-*' -print0
          )
          test "${#run_roots[@]}" -eq 1
          run_root="${run_roots[0]}"
          printf '%s\n' "${run_root}" > "${evidence_root}/run-root.txt"
          "${emrys[@]}" inspect \
            | tee "${evidence_root}/05-inspect.log"
          grep --fixed-strings --line-regexp 'Run integrity: valid' \
            "${evidence_root}/05-inspect.log"
          grep --fixed-strings --line-regexp 'Attempt outcome: succeeded' \
            "${evidence_root}/05-inspect.log"
          grep --fixed-strings --line-regexp 'Scientific Results: complete' \
            "${evidence_root}/05-inspect.log"
          grep --fixed-strings --line-regexp 'Reporting: complete' \
            "${evidence_root}/05-inspect.log"
          test "$(find "${run_root}/results/reports" -type f -name '*.html' | wc -l)" -eq 2

      - name: Require the clean clone to remain unchanged
        if: always() && steps.golden.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git -C "${{ steps.golden.outputs.clone }}" status \
            --porcelain=v1 --untracked-files=all \
            > "${{ steps.golden.outputs.evidence }}/checkout-after.tsv"
          test ! -s "${{ steps.golden.outputs.evidence }}/checkout-after.tsv"

      - name: Upload managed golden-path evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emrys-managed-golden-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emrys-managed-golden/*.log
            ${{ runner.temp }}/emrys-managed-golden/*.txt
            ${{ runner.temp }}/emrys-managed-golden/*.tsv
            ${{ runner.temp }}/emrys-managed-golden/project/project.yaml
            ${{ runner.temp }}/emrys-managed-golden/project/samples.tsv
            ${{ runner.temp }}/emrys-managed-golden/project/partitions.tsv
            ${{ runner.temp }}/emrys-managed-golden/project/fixture.json
            ${{ runner.temp }}/emrys-managed-golden/project/fixture.manifest.json
            ${{ runner.temp }}/emrys-managed-golden/project/inputs
            ${{ runner.temp }}/emrys-managed-golden/project/logs
            ${{ runner.temp }}/emrys-managed-golden/project/runs
            ${{ runner.temp }}/emrys-managed-golden/project/runtime/runtime.tsv
            ${{ runner.temp }}/emrys-managed-golden/project/runtime/profiles
            ${{ runner.temp }}/emrys-managed-golden/project/runtime/.emrys-storage-qualification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  python314-coverage-shards:
    name: Python 3.14 tests + coverage (shard ${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up primary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Run complete-suite shard with live slow-test timings
        shell: bash
        run: >-
          make -s python-coverage-shard
          PYTHON_TEST_SHARD_INDEX=${{ matrix.shard }}
          PYTHON_TEST_SHARD_COUNT=${{ env.PYTHON_TEST_SHARD_COUNT }}
          PYTHON_COVERAGE_WORKERS=2

      - name: Upload coverage fragment and selection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python314-coverage-shard-${{ matrix.shard }}
          path: |
            .coverage-work/.coverage.*
            .coverage-work/python-test-shard-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  python314-coverage:
    name: Python 3.14 complete suite and coverage policy
    needs: python314-coverage-shards
    if: >-
      always() &&
      github.event_name != 'workflow_dispatch' &&
      github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up primary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Download every coverage shard
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: python314-coverage-shard-*
          path: .coverage-work/merged
          merge-multiple: true

      - name: Verify complete and disjoint shard receipts
        shell: bash
        run: >-
          .venv/bin/python tests/tools/python_test_shards.py verify
          --repo-root "${GITHUB_WORKSPACE}"
          --receipt-dir "${GITHUB_WORKSPACE}/.coverage-work/merged"

      - name: Require every behavioral shard to pass
        shell: bash
        run: test "${{ needs.python314-coverage-shards.result }}" = "success"

      - name: Merge coverage and run isolated subprocess probes
        shell: bash
        run: >-
          make -s python-coverage-finalize
          PYTHON_COVERAGE_ROOT="${GITHUB_WORKSPACE}/.coverage-work/merged"

      - name: Enforce reviewed Python coverage policy
        shell: bash
        run: >-
          make -s python-coverage-enforce
          PYTHON_COVERAGE_ROOT="${GITHUB_WORKSPACE}/.coverage-work/merged"

  python311-smoke:
    name: Python 3.11 compatibility smoke
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.MINIMUM_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Compile, package, and invoke the supported minimum
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            .venv/bin/python -m compileall -q scripts src/emrys tests
          make -s validation-wheel-smoke
          .venv/bin/python -I -m emrys validate manifest \
            --manifest configs/samples.example.tsv

  python311-full-shards:
    name: Python 3.11 nightly full suite (shard ${{ matrix.shard }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.python311)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.MINIMUM_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Run complete-suite shard with live slow-test timings
        shell: bash
        run: >-
          .venv/bin/python tests/tools/python_test_shards.py run
          --repo-root "${GITHUB_WORKSPACE}"
          --shard-index ${{ matrix.shard }}
          --shard-count ${{ env.PYTHON_TEST_SHARD_COUNT }}
          --workers 2
          --receipt
          "${RUNNER_TEMP}/emrys-python311-test-shards/python-test-shard-${{ matrix.shard }}-of-${{ env.PYTHON_TEST_SHARD_COUNT }}.json"

      - name: Upload selection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python311-test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/emrys-python311-test-shards/python-test-shard-*.json
          if-no-files-found: error
          retention-days: 7

  python311-full:
    name: Python 3.11 nightly complete suite
    needs: python311-full-shards
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.python311))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.MINIMUM_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Download every Python 3.11 shard receipt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: python311-test-shard-*
          path: ${{ runner.temp }}/emrys-python311-test-shards/merged
          merge-multiple: true

      - name: Verify complete and disjoint shard receipts
        shell: bash
        run: >-
          .venv/bin/python tests/tools/python_test_shards.py verify
          --repo-root "${GITHUB_WORKSPACE}"
          --receipt-dir "${RUNNER_TEMP}/emrys-python311-test-shards/merged"

      - name: Require every Python 3.11 shard to pass
        shell: bash
        run: test "${{ needs.python311-full-shards.result }}" = "success"

  synthetic-e2e:
    name: Real synthetic E2E (selected profiles)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.synthetic_130 || inputs.synthetic_100000))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Select managed-runtime paths
        shell: bash
        run: |
          printf 'PIXI_WORKSPACE=%s/emrys-managed-runtime\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'PIXI_MANIFEST=%s/emrys-managed-runtime/pixi.toml\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Seed external evidence roots for selected profiles
        shell: bash
        env:
          RUN_SYNTHETIC_130: ${{ github.event_name == 'schedule' || inputs.synthetic_130 }}
          RUN_SYNTHETIC_100000: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 0') || inputs.synthetic_100000 }}
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/emrys-synthetic-e2e"
          install -d -m 0700 "${evidence_root}" "${evidence_root}/runtime" "${evidence_root}/slurm"
          if [[ "${RUN_SYNTHETIC_130}" == true ]]; then
            install -d -m 0700 "${evidence_root}/130" "${evidence_root}/130/operator"
            printf 'profile\tdataset_profile\ttrigger\tcommit\n130\tsmoke-v1\t%s\t%s\n' \
              "${GITHUB_EVENT_NAME}" "${GITHUB_SHA}" \
              > "${evidence_root}/130/selection.tsv"
          fi
          if [[ "${RUN_SYNTHETIC_100000}" == true ]]; then
            install -d -m 0700 "${evidence_root}/100000" "${evidence_root}/100000/operator"
            printf 'profile\tdataset_profile\ttrigger\tcommit\n100000\tproduction-like-v1\t%s\t%s\n' \
              "${GITHUB_EVENT_NAME}" "${GITHUB_SHA}" \
              > "${evidence_root}/100000/selection.tsv"
          fi
          printf 'E2E_EVIDENCE_ROOT=%s\n' "${evidence_root}" >> "${GITHUB_ENV}"
          printf 'RENV_PATHS_CACHE=%s/emrys-renv/cache\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          printf 'RENV_PATHS_LIBRARY=%s/emrys-renv/library\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"

      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up primary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PRIMARY_PYTHON_VERSION }}

      - name: Set up locked uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Stage the reviewed runtime lock outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "${PIXI_WORKSPACE}"
          cp -- \
            src/emrys/resources/runtime/pixi.toml \
            src/emrys/resources/runtime/pixi.lock \
            "${PIXI_WORKSPACE}/"

      - name: Restore locked native and R base environments
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          manifest-path: ${{ env.PIXI_MANIFEST }}
          environments: native r
          activate-environment: r
          locked: true
          cache: true
          cache-key: emrys-real-e2e-runtime-
          post-cleanup: true

      - name: Install disposable Slurm
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            munge \
            slurm-wlm

      - name: Restore exact R dependency cache
        id: renv-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/emrys-renv/cache
            ${{ runner.temp }}/emrys-renv/library
          key: >-
            emrys-real-e2e-pixi-renv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('renv.lock', 'src/emrys/resources/runtime/pixi.lock') }}

      - name: Restore locked Python environment
        shell: bash
        run: uv sync --locked --group workflow --python python

      - name: Restore and select locked R environment
        shell: bash
        run: |
          set -euo pipefail
          rscript_bin="$(command -v Rscript)"
          make -s r-restore RSCRIPT_BIN="${rscript_bin}"
          renv_library="$({
            EMRYS_USE_RENV=1 \
            EMRYS_LOCAL_PILOT_R=0 \
            RENV_CONFIG_SANDBOX_ENABLED=FALSE \
            RENV_CONFIG_AUTO_SNAPSHOT=FALSE \
            RENV_PROJECT="${GITHUB_WORKSPACE}" \
            R_PROFILE_USER="${GITHUB_WORKSPACE}/.Rprofile" \
              "${rscript_bin}" -e \
                'cat(normalizePath(.libPaths()[[1L]], winslash = "/", mustWork = TRUE))'
          })"
          test -n "${renv_library}"
          test -d "${renv_library}"
          printf 'RENV_LIBRARY=%s\n' "${renv_library}" >> "${GITHUB_ENV}"

      - name: Save exact R dependency cache after successful restore
        if: steps.renv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/emrys-renv/cache
            ${{ runner.temp }}/emrys-renv/library
          key: ${{ steps.renv-cache.outputs.cache-primary-key }}

      - name: Record exact runtime authorities outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          real_tools_prefix="${PIXI_WORKSPACE}/.pixi/envs/native"
          r_prefix="${PIXI_WORKSPACE}/.pixi/envs/r"
          runtime_evidence="${E2E_EVIDENCE_ROOT}/runtime"
          test -d "${real_tools_prefix}"
          test -d "${r_prefix}"
          test "$(sha256sum src/emrys/resources/runtime/pixi.toml | awk '{print $1}')" = \
            "$(sha256sum "${PIXI_WORKSPACE}/pixi.toml" | awk '{print $1}')"
          test "$(sha256sum src/emrys/resources/runtime/pixi.lock | awk '{print $1}')" = \
            "$(sha256sum "${PIXI_WORKSPACE}/pixi.lock" | awk '{print $1}')"
          cp -- \
            src/emrys/resources/runtime/pixi.toml \
            src/emrys/resources/runtime/pixi.lock \
            renv.lock \
            uv.lock \
            "${runtime_evidence}/"
          cp -a -- \
            "${real_tools_prefix}/conda-meta" \
            "${runtime_evidence}/native-conda-meta"
          cp -a -- \
            "${r_prefix}/conda-meta" \
            "${runtime_evidence}/r-conda-meta"
          pixi list --locked --manifest-path "${PIXI_MANIFEST}" \
            --environment native --json \
            > "${runtime_evidence}/pixi-native-packages.json"
          pixi list --locked --manifest-path "${PIXI_MANIFEST}" \
            --environment r --json \
            > "${runtime_evidence}/pixi-r-packages.json"
          {
            printf 'tool\tpath\tsha256\n'
            for tool in STAR samtools gatk bcftools infer_experiment.py java; do
              path="${real_tools_prefix}/bin/${tool}"
              test -x "${path}"
              printf '%s\t%s\t%s\n' \
                "${tool}" "${path}" "$(sha256sum "${path}" | awk '{print $1}')"
            done
            mapfile -t picard_jars < <(find "${real_tools_prefix}/share" \
              -type f -path '*/picard-slim-3.1.1-*/picard.jar' -print)
            test "${#picard_jars[@]}" -eq 1
            printf 'picard.jar\t%s\t%s\n' \
              "${picard_jars[0]}" \
              "$(sha256sum "${picard_jars[0]}" | awk '{print $1}')"
          } > "${runtime_evidence}/tool-sha256.tsv"
          git status --porcelain=v1 --untracked-files=all \
            > "${runtime_evidence}/checkout-before.tsv"
          test ! -s "${runtime_evidence}/checkout-before.tsv"

      - name: Configure and prove one disposable Slurm node
        shell: bash
        run: bash tests/tools/configure_ci_slurm.sh "${E2E_EVIDENCE_ROOT}/slurm"

      - name: Run the selected 130-pair real synthetic E2E
        id: synthetic-130
        if: github.event_name == 'schedule' || inputs.synthetic_130
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          real_tools_prefix="${PIXI_WORKSPACE}/.pixi/envs/native"
          .venv/bin/python tests/tools/real_synthetic_e2e.py \
            --profile 130 \
            --repo-root "${GITHUB_WORKSPACE}" \
            --operator-root "${E2E_EVIDENCE_ROOT}/130/operator" \
            --runtime-prefix "${real_tools_prefix}" \
            --rscript "$(command -v Rscript)" \
            --renv-library "${RENV_LIBRARY}" \
            --storage-compute-launcher-json \
              '["/usr/bin/srun","--partition=emrys-ci","--nodes=1","--ntasks=1","--cpus-per-task=1","--mem=1G","--time=00:05:00","--wait=60"]' \
            --slurm-partition emrys-ci \
            --slurm-memory 6G \
            --slurm-time 02:00:00 \
            --slurm-timeout-seconds 7200 \
            --execute

      - name: Upload retained 130-pair evidence
        id: upload-synthetic-130
        if: >-
          always() &&
          (github.event_name == 'schedule' || inputs.synthetic_130)
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emrys-real-synthetic-130-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emrys-synthetic-e2e/130
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Run the selected 100,000-pair real synthetic E2E
        id: synthetic-100000
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 0') ||
          inputs.synthetic_100000
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          real_tools_prefix="${PIXI_WORKSPACE}/.pixi/envs/native"
          .venv/bin/python tests/tools/real_synthetic_e2e.py \
            --profile 100000 \
            --repo-root "${GITHUB_WORKSPACE}" \
            --operator-root "${E2E_EVIDENCE_ROOT}/100000/operator" \
            --runtime-prefix "${real_tools_prefix}" \
            --rscript "$(command -v Rscript)" \
            --renv-library "${RENV_LIBRARY}" \
            --storage-compute-launcher-json \
              '["/usr/bin/srun","--partition=emrys-ci","--nodes=1","--ntasks=1","--cpus-per-task=1","--mem=1G","--time=00:05:00","--wait=60"]' \
            --slurm-partition emrys-ci \
            --slurm-memory 6G \
            --slurm-time 02:00:00 \
            --slurm-timeout-seconds 7200 \
            --execute

      - name: Upload retained 100,000-pair evidence
        id: upload-synthetic-100000
        if: >-
          always() &&
          ((github.event_name == 'schedule' && github.event.schedule == '17 5 * * 0') ||
          inputs.synthetic_100000)
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emrys-real-synthetic-100000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emrys-synthetic-e2e/100000
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Retain terminal scheduler diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          squeue --all --long > "${E2E_EVIDENCE_ROOT}/slurm/final-squeue.txt" 2>&1
          sinfo --all --long > "${E2E_EVIDENCE_ROOT}/slurm/final-sinfo.txt" 2>&1
          scontrol show nodes -o > "${E2E_EVIDENCE_ROOT}/slurm/final-nodes.txt" 2>&1
          systemctl --no-pager --full status munge slurmctld slurmd \
            > "${E2E_EVIDENCE_ROOT}/slurm/final-systemd-status.txt" 2>&1
          sudo journalctl --no-pager -u munge -u slurmctld -u slurmd \
            > "${E2E_EVIDENCE_ROOT}/slurm/final-journal.txt" 2>&1
          exit 0

      - name: Require the checkout to remain unchanged
        id: checkout-unchanged
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all \
            > "${E2E_EVIDENCE_ROOT}/runtime/checkout-after.tsv"
          test ! -s "${E2E_EVIDENCE_ROOT}/runtime/checkout-after.tsv"

      - name: Upload shared runtime and Slurm evidence
        id: upload-synthetic-infrastructure
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emrys-real-synthetic-infrastructure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emrys-synthetic-e2e/runtime
            ${{ runner.temp }}/emrys-synthetic-e2e/slurm
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Require every selected synthetic lane and evidence upload to pass
        if: always()
        shell: bash
        env:
          SELECT_130: ${{ github.event_name == 'schedule' || inputs.synthetic_130 }}
          SELECT_100000: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 5 * * 0') || inputs.synthetic_100000 }}
          OUTCOME_130: ${{ steps.synthetic-130.outcome }}
          OUTCOME_100000: ${{ steps.synthetic-100000.outcome }}
          UPLOAD_130: ${{ steps.upload-synthetic-130.outcome }}
          UPLOAD_100000: ${{ steps.upload-synthetic-100000.outcome }}
          UPLOAD_INFRASTRUCTURE: ${{ steps.upload-synthetic-infrastructure.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout-unchanged.outcome }}
        run: |
          set -euo pipefail
          failed=false
          if [[ "${SELECT_130}" == true &&
                ("${OUTCOME_130}" != success || "${UPLOAD_130}" != success) ]]; then
            printf 'ERROR: selected 130-pair lane or its evidence upload failed.\n' >&2
            failed=true
          fi
          if [[ "${SELECT_100000}" == true &&
                ("${OUTCOME_100000}" != success || "${UPLOAD_100000}" != success) ]]; then
            printf 'ERROR: selected 100,000-pair lane or its evidence upload failed.\n' >&2
            failed=true
          fi
          if [[ "${CHECKOUT_OUTCOME}" != success ]]; then
            printf 'ERROR: E2E provisioning or execution changed the source checkout.\n' >&2
            failed=true
          fi
          if [[ "${UPLOAD_INFRASTRUCTURE}" != success ]]; then
            printf 'ERROR: shared runtime or Slurm evidence upload failed.\n' >&2
            failed=true
          fi
          [[ "${failed}" == false ]]
