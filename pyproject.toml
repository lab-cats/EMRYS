[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "norad-rna-workflow"
dynamic = ["version"]
description = "Internal Python package for the NORAD RNA workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "jsonschema>=4.18.0",
    "referencing>=0.28.4",
]

[project.scripts]
norad = "norad.__main__:main"

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "pytest",
    "pytest-xdist",
    "ruff",
    "vulture",
]
workflow = [
    "snakemake==9.25.1",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["norad*"]
namespaces = false

[tool.setuptools.package-data]
"norad.contracts" = [
    "schemas/artifacts/v1/*.json",
    "schemas/artifacts/v2/*.json",
    "schemas/orchestration/v1/*.json",
]
"norad.reporting" = ["styles/*.css", "templates/*.html.j2"]

[tool.setuptools.dynamic]
version = { attr = "norad.__version__" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9"]
