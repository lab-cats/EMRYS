[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "norad-rna-workflow"
dynamic = ["version"]
description = "Internal Python package for the NORAD RNA workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["norad*"]
namespaces = false

[tool.setuptools.package-data]
"norad.contracts" = ["schemas/artifacts/v1/*.json"]
"norad.reporting" = ["styles/*.css", "templates/*.qmd"]

[tool.setuptools.dynamic]
version = { attr = "norad.__version__" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9"]
