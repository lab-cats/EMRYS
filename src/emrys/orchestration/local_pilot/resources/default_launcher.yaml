schema_version: emrys.local-pilot-launcher.v1
slurm:
  account:
    env: EMRYS_SLURM_ACCOUNT
  partition:
    env: EMRYS_SLURM_PARTITION
  qos:
    env: EMRYS_SLURM_QOS
  cpus_per_task: 4
  memory: site-default
  time: "03:00:00"
  exclusive: false
  nodelist: null
paths:
  log_dir:
    env: EMRYS_LOG_DIR
  request: request.yaml
  workspace:
    env: EMRYS_WORKSPACE
  runtime_profile: runtime.selected.tsv
  scratch_parent:
    env: EMRYS_SCRATCH_PARENT
modules:
  mode: none
  init: ""
  load: []
