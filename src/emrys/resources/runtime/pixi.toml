[workspace]
name = "emrys-managed-runtime"
channels = ["conda-forge", "bioconda"]
platforms = [
  { name = "linux-x86-64-floor", platform = "linux-64", linux = "4.18", glibc = "2.28" },
]
requires-pixi = ">=0.75.0,<0.76"
channel-priority = "strict"

[feature.native.dependencies]
bash = ">=3.2"
bcftools = "1.21.*"
coreutils = "*"
gatk4 = "4.6.1.0.*"
grep = "*"
gzip = "*"
openjdk = "17.*"
picard-slim = "3.1.1.*"
rseqc = "5.0.4.*"
samtools = "1.19.2.*"
star = "2.7.11b.*"

[feature.r.dependencies]
bzip2 = "*"
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"
libcurl = "*"
libpng = "*"
libxml2-devel = "*"
make = "*"
openssl = "*"
pkg-config = "*"
r-base = "4.6.1.*"
xz = "*"
zlib = "*"

[environments]
native = ["native"]
r = ["r"]
