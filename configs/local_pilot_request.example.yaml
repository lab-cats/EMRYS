schema_version: norad.request.v2
label: local-pilot-example
profile: norad.profile.local_cmh.v2
sample_manifest: local_pilot_samples.example.tsv
partition_manifest: local_pilot_partitions.example.tsv
reference:
  id: replace-with-reference-id
  fasta: inputs/reference/genome.fa
  gtf: inputs/reference/annotation.gtf
  star_index:
    sjdb_overhang: 149
    genome_sa_index_nbases: 14
cohort_id: replace-with-cohort-id
resources:
  workflow_cores: 4
  sample_concurrency: 1
  step_threads:
    "00a": 4
    "01": 4
    "02": 1
    "06": 4
    "08": 1
analysis:
  id: replace-with-analysis-id
  control_condition: control
  treatment_condition: treatment
  rna_ref: A
  rna_alt: G
  min_sample_dp: 1
  mean_dp_threshold: 50
  fdr_threshold: 0.05
  common_or_threshold: 1.2
  absolute_difference_threshold: 0.005
  background_condition: null
  background_max_fraction: 0.01
