schema_version: emrys.execution-profile.v1

# Scientific inputs, workspace, runtime, and execution enablement are deliberately
# not profile fields. This file contains only Run-bound computational policy and
# Attempt-local placement.
resources:
  schema_version: emrys.local-pilot-resources.v1
  workflow_cores: 4
  workflow_memory_mb: allocation
  stage_concurrency:
    "01": 1
    "02": 1
    "02b": 1
    "03": 1
    "04": 1
    "05": 1
    "06": 1
    "07": 1
  step_threads:
    "00a": 4
    "01": 4
    "02": 1
    "06": 4
    "08": 1
  stage_memory_mb:
    "00a": workflow
    "00b": workflow
    "00c": workflow
    "01": workflow
    "02": workflow
    "02b": workflow
    "03": workflow
    "04": workflow
    "05": workflow
    "06": workflow
    "07": workflow
    "08": workflow
    "09": workflow
    "10": workflow
  reporting_memory_mb:
    artifact_index: workflow
    run_summary: workflow
    html_report: workflow

placement:
  kind: slurm
  account: replace-with-site-account
  partition: replace-with-site-partition
  qos: null
  cpus_per_task: 4
  memory_mb: null
  time: "03:00:00"
  exclusive: false
  nodelist: null
  scratch_parent: /absolute/path/to/compute-scratch
  modules:
    mode: none
    init: ""
    load: []
